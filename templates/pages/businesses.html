{% extends "base.html" %}
{% block title %}Businesses · {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="container py-4">
  <h1 class="h3 fw-bold mb-3">Business Directory</h1>
  <div class="row g-3">
    <div class="col-lg-3">
      <div class="card shadow-sm"><div class="card-body">
        <h6 class="fw-bold">Filters</h6>
        <div class="mb-2"><label class="form-label small">Search</label><input class="form-control form-control-sm" id="f-search"></div>
        <div class="mb-2"><label class="form-label small">Category</label><select class="form-select form-select-sm" id="f-category"><option value="">All</option></select></div>
        <div class="mb-2"><label class="form-label small">Region</label><select class="form-select form-select-sm" id="f-region"><option value="">All</option></select></div>
        <div class="form-check mb-2"><input class="form-check-input" type="checkbox" id="f-verified"><label class="form-check-label small" for="f-verified">Verified only</label></div>
        <button class="btn btn-success btn-sm w-100" id="f-apply">Apply</button>
      </div></div>
    </div>
    <div class="col-lg-9">
      <div class="row g-3" id="list"></div>
      <nav class="mt-3"><ul class="pagination justify-content-center" id="pager"></ul></nav>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/listing.js"></script>
<script>
let page = 1;
async function loadFilters() {
  const [cats, regions] = await Promise.all([
    FL.request("/categories/?kind=business&page_size=100", { auth: false }),
    FL.request("/regions/?page_size=100", { auth: false }),
  ]);
  fillSelect("f-category", cats.results, "name");
  fillSelect("f-region", regions.results, "name");
}
function fillSelect(id, items, label) {
  const el = document.getElementById(id);
  items.forEach((i) => el.insertAdjacentHTML("beforeend", `<option value="${i.id}">${FLUI.escape(i[label])}</option>`));
}
async function load() {
  const target = document.getElementById("list");
  FLUI.spinner(target);
  const params = {
    page, search: document.getElementById("f-search").value,
    category: document.getElementById("f-category").value,
    region: document.getElementById("f-region").value,
    verification_status: document.getElementById("f-verified").checked ? "verified" : "",
  };
  const data = await FL.request("/businesses/" + FLUI.qs(params), { auth: false });
  if (!data.results.length) return FLUI.empty(target);
  target.innerHTML = data.results.map(card).join("");
  data.current = page;
  renderPager("pager", data, (p) => { page = p; load(); });
}
function card(b) {
  return `<div class="col-sm-6 col-lg-4"><div class="card card-listing h-100 shadow-sm">
    <img class="card-img-top" src="${b.cover_image || 'https://placehold.co/600x300/eef2ee/1f8a4c?text=FursaLink'}">
    <div class="card-body">
      <div class="d-flex justify-content-between"><h5 class="h6">${FLUI.escape(b.name)}</h5>
      ${b.verification_status === 'verified' ? '<i class="bi bi-patch-check-fill text-success" title="Verified"></i>' : ''}</div>
      <p class="small text-muted mb-1">${FLUI.escape(b.category_name||'General')} · ${FLUI.escape(b.region_name||'TZ')}</p>
      <div class="small mb-2">★ ${b.average_rating} <span class="text-muted">(${b.reviews_count})</span></div>
      <a class="btn btn-sm btn-outline-success" href="/businesses/${b.slug}/">View</a>
    </div></div></div>`;
}
document.getElementById("f-apply").addEventListener("click", () => { page = 1; load(); });
loadFilters(); load();
</script>
{% endblock %}
