{% extends "base.html" %}
{% block title %}Jobs · {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="container py-4">
  <h1 class="h3 fw-bold mb-3">Job Portal</h1>
  <div class="row g-2 mb-3">
    <div class="col-md-5"><input class="form-control" id="f-search" placeholder="Search jobs..."></div>
    <div class="col-md-4"><select class="form-select" id="f-type"><option value="">All types</option>
      <option value="full_time">Full Time</option><option value="part_time">Part Time</option>
      <option value="internship">Internship</option><option value="freelance">Freelance</option><option value="contract">Contract</option></select></div>
    <div class="col-md-3 d-grid"><button class="btn btn-success" id="f-apply">Filter</button></div>
  </div>
  <div class="row g-3" id="list"></div>
  <nav class="mt-3"><ul class="pagination justify-content-center" id="pager"></ul></nav>
</div>

<div class="modal fade" id="applyModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <form id="apply-form"><div class="modal-header"><h5 class="modal-title">Apply</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <input type="hidden" name="job_id">
    <p class="small text-muted" id="apply-job-title"></p>
    <textarea class="form-control mb-2" name="cover_letter" placeholder="Cover letter"></textarea>
    <input type="file" class="form-control" name="cv">
  </div>
  <div class="modal-footer"><button type="submit" class="btn btn-success">Submit application</button></div></form>
</div></div></div>
{% endblock %}
{% block scripts %}
<script src="/static/js/listing.js"></script>
<script>
let page = 1;
async function load() {
  const target = document.getElementById("list"); FLUI.spinner(target);
  const params = { page, search: document.getElementById("f-search").value, type: document.getElementById("f-type").value };
  const data = await FL.request("/jobs/" + FLUI.qs(params), { auth: false });
  if (!data.results.length) return FLUI.empty(target);
  target.innerHTML = data.results.map(card).join("");
  data.current = page; renderPager("pager", data, (p) => { page = p; load(); });
  document.querySelectorAll("[data-apply]").forEach(b => b.addEventListener("click", () => openApply(b.dataset.apply, b.dataset.title)));
}
function card(j) {
  const salary = (j.salary_min || j.salary_max) ? `${FLUI.money(j.salary_min, j.currency)} – ${FLUI.money(j.salary_max, j.currency)}` : 'Competitive';
  return `<div class="col-md-6"><div class="card card-listing h-100 shadow-sm"><div class="card-body">
    <div class="d-flex justify-content-between"><h5 class="h6">${FLUI.escape(j.title)}</h5><span class="badge bg-success-subtle text-success">${FLUI.escape(j.type_display)}</span></div>
    <p class="small text-muted mb-1"><i class="bi bi-building"></i> ${FLUI.escape(j.company)} ${j.location?'· '+FLUI.escape(j.location):''}</p>
    <div class="small text-success fw-semibold mb-2">${salary}</div>
    <p class="small">${FLUI.escape((j.description||'').slice(0,120))}</p>
    ${j.apply_url?`<a class="btn btn-sm btn-outline-success" href="${j.apply_url}" target="_blank">Apply externally</a>`
      :`<button class="btn btn-sm btn-success" data-apply="${j.id}" data-title="${FLUI.escape(j.title)}">Apply</button>`}
  </div></div></div>`;
}
function openApply(id, title) {
  if (!FL.isAuthenticated()) return window.location.href = "/login/";
  const form = document.getElementById("apply-form");
  form.job_id.value = id; document.getElementById("apply-job-title").textContent = title;
  new bootstrap.Modal(document.getElementById("applyModal")).show();
}
document.getElementById("apply-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  const fd = new FormData();
  fd.append("cover_letter", form.cover_letter.value);
  if (form.cv.files[0]) fd.append("cv", form.cv.files[0]);
  try {
    await FL.request(`/jobs/${form.job_id.value}/apply/`, { method: "POST", body: fd, isForm: true });
    FLUI.toast("Application submitted!");
    bootstrap.Modal.getInstance(document.getElementById("applyModal")).hide();
  } catch (err) { FLUI.toast(err.data?.detail || "Could not apply (already applied?).", "danger"); }
});
document.getElementById("f-apply").addEventListener("click", () => { page = 1; load(); });
load();
</script>
{% endblock %}
