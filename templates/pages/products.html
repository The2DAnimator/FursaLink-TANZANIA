{% extends "base.html" %}
{% block title %}Marketplace · {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="container py-4">
  <h1 class="h3 fw-bold mb-3">Product Marketplace</h1>
  <div class="row g-3">
    <div class="col-lg-3">
      <div class="card shadow-sm"><div class="card-body">
        <h6 class="fw-bold">Filters</h6>
        <div class="mb-2"><label class="form-label small">Search</label><input class="form-control form-control-sm" id="f-search"></div>
        <div class="mb-2"><label class="form-label small">Category</label><select class="form-select form-select-sm" id="f-category"><option value="">All</option></select></div>
        <div class="mb-2"><label class="form-label small">Region</label><select class="form-select form-select-sm" id="f-region"><option value="">All</option></select></div>
        <div class="row g-1">
          <div class="col"><label class="form-label small">Min</label><input type="number" class="form-control form-control-sm" id="f-min"></div>
          <div class="col"><label class="form-label small">Max</label><input type="number" class="form-control form-control-sm" id="f-max"></div>
        </div>
        <button class="btn btn-success btn-sm w-100 mt-2" id="f-apply">Apply</button>
        <hr>
        <a class="btn btn-outline-success btn-sm w-100" href="/dashboard/#products">+ Sell a product</a>
      </div></div>
    </div>
    <div class="col-lg-9">
      <div class="row g-3" id="list"></div>
      <nav class="mt-3"><ul class="pagination justify-content-center" id="pager"></ul></nav>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/listing.js"></script>
<script>
let page = 1;
const url = new URLSearchParams(window.location.search);
document.getElementById("f-search").value = url.get("search") || "";
async function loadFilters() {
  const [cats, regions] = await Promise.all([
    FL.request("/categories/?kind=product&page_size=100", { auth: false }),
    FL.request("/regions/?page_size=100", { auth: false }),
  ]);
  cats.results.forEach(c => document.getElementById("f-category").insertAdjacentHTML("beforeend", `<option value="${c.id}">${FLUI.escape(c.name)}</option>`));
  regions.results.forEach(r => document.getElementById("f-region").insertAdjacentHTML("beforeend", `<option value="${r.id}">${FLUI.escape(r.name)}</option>`));
}
async function load() {
  const target = document.getElementById("list"); FLUI.spinner(target);
  const params = { page, search: document.getElementById("f-search").value,
    category: document.getElementById("f-category").value, region: document.getElementById("f-region").value,
    min_price: document.getElementById("f-min").value, max_price: document.getElementById("f-max").value };
  const data = await FL.request("/products/" + FLUI.qs(params), { auth: false });
  if (!data.results.length) return FLUI.empty(target);
  target.innerHTML = data.results.map(card).join("");
  data.current = page; renderPager("pager", data, (p) => { page = p; load(); });
}
function card(p) {
  const img = (p.images && p.images[0] && p.images[0].image) || 'https://placehold.co/600x300/eef2ee/1f8a4c?text=Product';
  return `<div class="col-sm-6 col-lg-4"><div class="card card-listing h-100 shadow-sm">
    <img class="card-img-top" src="${img}">
    <div class="card-body">
      <h5 class="h6">${FLUI.escape(p.name)}</h5>
      <div class="fw-bold text-success">${FLUI.money(p.price, p.currency)} <small class="text-muted fw-normal">/ ${FLUI.escape(p.unit)}</small></div>
      <p class="small text-muted mb-1">${FLUI.escape(p.category_name||'')} ${p.location?'· '+FLUI.escape(p.location):''}</p>
      <span class="badge ${p.in_stock?'bg-success-subtle text-success':'bg-secondary-subtle text-secondary'}">${p.in_stock?'In stock':'Out of stock'}</span>
    </div></div></div>`;
}
document.getElementById("f-apply").addEventListener("click", () => { page = 1; load(); });
loadFilters(); load();
</script>
{% endblock %}
